<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otomatizon — Turn the free apps you already use into one business system</title>
    <meta
      name="description"
      content="Tell Otomatizon how your business works. It finds what you're doing manually, shows you what to automate, and builds it for you. Built for Kenyan small businesses, coaches & tutors."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Typography & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-[#FAF9F5] text-[#121316] antialiased min-h-screen selection:bg-[#15803D]/15 selection:text-[#15803D]">
    <script>
      // Global error listener to display any early script failures directly on screen
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var existing = document.getElementById('global-err-box');
        if (!existing) {
          var box = document.createElement('div');
          box.id = 'global-err-box';
          box.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;z-index:999999;background:#18181b;color:#f87171;padding:20px;border-radius:12px;border:1px solid #ef4444;font-family:monospace;max-height:80vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,0.8);';
          box.innerHTML = '<div style="color:#ef4444;font-weight:bold;margin-bottom:8px;">⚠️ Startup Error: ' + (e.message || 'Script error') + '</div><div style="font-size:12px;color:#a1a1aa;">File: ' + (e.filename || 'unknown') + ':' + (e.lineno || 0) + '</div>';
          document.body.appendChild(box);
        }
      });
    </script>

    <!-- Global SVG Noise Texture -->
    <svg class="noise-overlay" aria-hidden="true">
      <filter id="noiseFilter">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.8"
          numOctaves="3"
          stitchTiles="stitch"
        />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <div id="root">
      <!-- Fast fallback loader while scripts load -->
      <div style="display:flex;height:100vh;align-items:center;justify-content:center;color:#71717a;font-family:sans-serif;font-size:14px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:16px;height:16px;border:2px solid #10b981;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <span>Loading Otomatizon...</span>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>

    <!-- Vendor libraries & application bundle -->
    <script src="/vendor.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
